# Weekly, grouped update PRs. Each runs the full CI, Terraform plan aside:
# Dependabot gets no OIDC token, so infra changes are planned on main instead,
# before the gated apply.
#
# cooldown: a release must be two weeks old before it is proposed, so a
# hijacked or broken version has time to be noticed and pulled first.
#
# Groups take minor and patch updates only. A major version arrives as its
# own PR, so one breaking upgrade never holds back the safe ones it would
# otherwise be bundled with.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'shiki']
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # astro check refuses TypeScript 7 ("does not currently support
      # TypeScript 7.0"). Lift this once @astrojs/check supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: terraform
    directories: ['/infra/bootstrap', '/infra/main']
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      providers:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(infra)
